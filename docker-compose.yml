version: '3'

services:
  personalized-wellness:
    image: yeowonkim/personalized-wellness
    container_name: personalized-wellness
    ports:
      - "8080:8080"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - personalized-wellness
    restart: unless-stopped

