version: '3'
services:
  personalized-wellness:
    image: yeowonkim/personalized-wellness
    container_name: personalized-wellness
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - personalized-wellness
    restart: always
