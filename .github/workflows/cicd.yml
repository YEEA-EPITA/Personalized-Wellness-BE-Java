name: Java CI with Maven and Docker

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

jobs:
  build-and-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

#      - name: Run tests with Maven
#        run: ./mvnw test
#        env:
#          allowedOrigins: "*"

#      - name: Print test failure reports
#        if: failure()
#        run: |
#          echo "::group::Surefire Reports"
#          cat target/surefire-reports/*.txt || true
#          echo "::endgroup::"

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/personalized-wellness .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/personalized-wellness

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/personalized-wellness
            docker stop wellness || true
            docker rm wellness || true
            docker run -d --name wellness -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/personalized-wellness